
name: Build and deploy ASP.NET Core app to Azure



on:

  push:

    branches:

      - master

  workflow_dispatch:



env:

  AZURE_WEBAPP_NAME: godwin-portfolio-bincom

  DOTNET_VERSION: '9.0.x'

  PROJECT_PATH: GodwinPortfolio/GodwinPortfolio.csproj



permissions:

  contents: read



jobs:

  build:

    runs-on: ubuntu-latest



    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Setup .NET

        uses: actions/setup-dotnet@v4

        with:

          dotnet-version: ${{ env.DOTNET_VERSION }}



      - name: Restore dependencies

        run: dotnet restore "${{ env.PROJECT_PATH }}"



      - name: Build

        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore



      - name: Publish

        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build --output ./publish



      - name: Upload deployment artifact

        uses: actions/upload-artifact@v4

        with:

          name: dotnet-app

          path: ./publish



  deploy:

    runs-on: ubuntu-latest

    needs: build



    steps:

      - name: Download deployment artifact

        uses: actions/download-artifact@v4

        with:

          name: dotnet-app

          path: ./publish



      - name: Login to Azure

        uses: azure/login@v2

        with:

          creds: ${{ secrets.AZURE_CREDENTIALS }}



      - name: Deploy to Azure Web App

        uses: azure/webapps-deploy@v3

        with:

          app-name: ${{ env.AZURE_WEBAPP_NAME }}

          package: ./publish

